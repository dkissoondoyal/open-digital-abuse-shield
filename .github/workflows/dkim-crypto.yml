name: ODAS DKIM Cryptographic Integration

on:
  push:
    branches: [main, 'feature/v0.3-dkim-verification']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-dkim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install 'dkimpy>=1.1,<2' 'cryptography>=41,<47'
      - name: Run real cryptographic DKIM tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_dkim_crypto_integration.py' -v
